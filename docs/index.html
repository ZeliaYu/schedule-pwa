<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a78d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="排班">
<meta name="description" content="每日排班、加班与欠班统计，支持 Excel 导入，数据保存在本机">
<title>排班管理</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span id="orgName">排班管理</span>
    </div>
    <nav class="tabs" role="tablist" aria-label="主导航">
      <button class="tab" role="tab" data-view="dashboard" aria-selected="true">统计</button>
      <button class="tab" role="tab" data-view="month" aria-selected="false">月排班</button>
      <button class="tab" role="tab" data-view="day" aria-selected="false">今日</button>
      <button class="tab" role="tab" data-view="people" aria-selected="false">人员</button>
    </nav>
    <div class="top-actions">
      <button class="icon-btn" id="btnImport" title="导入 Excel" aria-label="导入 Excel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      </button>
      <button class="icon-btn" id="btnTheme" title="切换主题" aria-label="切换主题">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <div class="loading">加载中…</div>
  </main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>

<!-- 计算与存储（本地，无后端） -->
<script src="xlsx.full.min.js"></script>
<script src="store.js"></script>
<script src="stats.js"></script>
<script src="excel_parse.js"></script>
<script src="importer.js"></script>
<script src="local_api.js"></script>
<script src="app.js"></script>
</body>
</html>
